<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>体調記録</title>

<body>
  <header class="top">
    <h1><span>体調記録</span><small id="who"></small></h1>
    <nav class="nav" id="nav" hidden>
      <button data-view="record" id="navRecord">記録する</button>
      <button data-view="history">履歴・グラフ</button>
      <button data-view="report">医師用</button>
    </nav>
  </header>
  <main class="wrap" id="main"><p class="center muted">読み込み中…</p></main>

      <button class="btn sub" id="copyPrev">前回と同じ</button>
      <button class="btn" id="saveBtn">保存する</button>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
